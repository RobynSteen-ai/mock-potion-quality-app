---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: potion-quality-app
  labels:
    app: potion-quality
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: potion-quality
  template:
    metadata:
      labels:
        app: potion-quality
    spec:
      containers:
        - name: potion-quality-app
          image: robynsteen/mock-potion-quality-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
